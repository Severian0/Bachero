document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px solid var(--color-divider); }\n.btn { border: 1px solid var(--color-divider); }\n.btn-primary { border-color: var(--color-accent); }\n.btn-ghost { border-color: transparent; }\n\n<\u002Fstyle>\n<style>\n  :root {\n    --font-body: \"Inter\", system-ui, sans-serif;\n    --font-heading: \"Inter\", system-ui, sans-serif;\n    --font-heading-weight: 600;\n    --radius-sm: 5px;\n    --radius-md: 10px;\n    --radius-lg: 16px;\n  }\n  html, body { margin: 0; padding: 0; background: #f2f2f3; font-family: \"Inter\", system-ui, sans-serif; letter-spacing: -0.005em; }\n  * { box-sizing: border-box; }\n  a { color: var(--color-accent-700); text-decoration: none; }\n  a:hover { color: var(--color-accent-900); }\n  @keyframes bch-breathe { 0%, 100% { opacity: 1 } 50% { opacity: .3 } }\n  ::-webkit-scrollbar { width: 10px; }\n  ::-webkit-scrollbar-thumb { background: color-mix(in srgb, #1d1f20 16%, transparent); border-radius: 5px; }\n  ::-webkit-scrollbar-track { background: transparent; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"height: 100vh; display: grid; grid-template-rows: 62px 1fr; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); overflow: hidden\">\n\n  <header style=\"display: flex; align-items: center; justify-content: space-between; padding: 0 var(--space-6); background: var(--color-neutral-100); color: var(--color-text); border-bottom: 1px solid var(--color-divider)\">\n    <div style=\"display: flex; align-items: center; gap: var(--space-4)\">\n      <span style=\"display: block; width: 28px; height: 28px; border: 1.5px solid var(--color-accent); border-radius: var(--radius-md)\"><\u002Fspan>\n      <div style=\"line-height: 1.25\">\n        <div style=\"font-weight: 700; font-size: 16px; letter-spacing: .04em; text-transform: uppercase\">Bachero<\u002Fdiv>\n        <div style=\"font-size: 12px; color: color-mix(in srgb, var(--color-text) 58%, transparent)\">{{ authority }} — Highways Maintenance Directorate<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display: flex; align-items: center; gap: var(--space-4); font-size: 12px; color: color-mix(in srgb, var(--color-text) 62%, transparent)\">\n      <span style=\"display: flex; align-items: center; gap: var(--space-2); padding: 5px 12px; border-radius: var(--radius-lg); background: var(--color-accent-100); color: var(--color-accent-800)\">\n        <i style=\"display: block; width: 7px; height: 7px; border-radius: 50%; background: var(--color-accent); animation: bch-breathe 2.4s ease-in-out infinite\"><\u002Fi>\n        {{ liveLabel }}\n      <\u002Fspan>\n      <span style=\"font-variant-numeric: tabular-nums\">{{ kmLabel }} km scanned today<\u002Fspan>\n      <span style=\"padding: 5px 12px; border: 1px solid var(--color-divider); border-radius: var(--radius-lg); font-size: 12px\">{{ dateLabel }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <main style=\"display: grid; grid-template-columns: 1fr 404px; min-height: 0\">\n\n    <section style=\"position: relative; overflow: hidden; border-right: 1px solid var(--color-divider); background: var(--color-neutral-200)\" sc-camel-on-mouse-leave=\"{{ clearHover }}\">\n\n      <svg sc-camel-view-box=\"0 0 100 100\" sc-camel-preserve-aspect-ratio=\"none\" style=\"position: absolute; inset: 0; width: 100%; height: 100%\">\n        <rect x=\"0\" y=\"0\" width=\"100\" height=\"100\" style=\"fill: color-mix(in srgb, var(--color-neutral-200) 55%, var(--color-bg))\"><\u002Frect>\n\n        <rect x=\"6\" y=\"20\" width=\"17\" height=\"13\" rx=\"1.4\" style=\"fill: color-mix(in srgb, var(--color-accent-200) 55%, var(--color-bg))\"><\u002Frect>\n        <rect x=\"56\" y=\"72\" width=\"22\" height=\"16\" rx=\"1.4\" style=\"fill: color-mix(in srgb, var(--color-accent-200) 55%, var(--color-bg))\"><\u002Frect>\n        <rect x=\"41\" y=\"4\" width=\"13\" height=\"10\" rx=\"1.4\" style=\"fill: color-mix(in srgb, var(--color-accent-200) 40%, var(--color-bg))\"><\u002Frect>\n\n        <path d=\"M0,78 C16,74 30,84 48,79 S76,69 100,73\" fill=\"none\" stroke-linecap=\"round\" vector-effect=\"non-scaling-stroke\" style=\"stroke: color-mix(in srgb, var(--color-accent-300) 70%, var(--color-bg)); stroke-width: 16px\"><\u002Fpath>\n\n        <g fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\" style=\"stroke: color-mix(in srgb, var(--color-neutral-400) 55%, transparent); stroke-width: 5px\">\n          <path d=\"M0,32 C22,29 38,36 62,31 S88,26 100,29\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M0,66 C20,63 36,70 58,65 S86,61 100,64\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M12,4 C14,26 9,48 14,68 S11,90 13,100\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M56,10 C58,30 52,50 57,70 S54,90 56,100\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M0,90 C24,86 48,94 72,89 S94,86 100,88\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n        <\u002Fg>\n        <g fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\" style=\"stroke: var(--color-neutral-100); stroke-width: 3.4px\">\n          <path d=\"M0,32 C22,29 38,36 62,31 S88,26 100,29\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M0,66 C20,63 36,70 58,65 S86,61 100,64\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M12,4 C14,26 9,48 14,68 S11,90 13,100\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M56,10 C58,30 52,50 57,70 S54,90 56,100\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M0,90 C24,86 48,94 72,89 S94,86 100,88\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n        <\u002Fg>\n\n        <g fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\" style=\"stroke: color-mix(in srgb, var(--color-neutral-500) 55%, transparent); stroke-width: 11px\">\n          <path d=\"M0,14 C20,17 40,10 60,15 S90,21 100,18\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M0,52 C25,48 45,58 70,50 S92,44 100,46\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M30,0 C32,20 27,40 34,60 S30,86 32,100\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M86,0 C84,25 90,45 84,66 S88,88 86,100\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M34,100 C50,78 62,60 78,44 S95,31 100,26\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n        <\u002Fg>\n        <g fill=\"none\" stroke-linecap=\"round\" stroke-linejoin=\"round\" vector-effect=\"non-scaling-stroke\" style=\"stroke: var(--color-neutral-100); stroke-width: 8px\">\n          <path d=\"M0,14 C20,17 40,10 60,15 S90,21 100,18\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M0,52 C25,48 45,58 70,50 S92,44 100,46\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M30,0 C32,20 27,40 34,60 S30,86 32,100\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M86,0 C84,25 90,45 84,66 S88,88 86,100\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n          <path d=\"M34,100 C50,78 62,60 78,44 S95,31 100,26\" vector-effect=\"non-scaling-stroke\"><\u002Fpath>\n        <\u002Fg>\n      <\u002Fsvg>\n\n      <sc-if value=\"{{ linked }}\" hint-placeholder-val=\"{{ false }}\">\n        <div>\n          <div style=\"position: absolute; top: 0; bottom: 0; width: 1px; left: {{ linked.left }}; background: color-mix(in srgb, var(--color-accent) 40%, transparent)\"><\u002Fdiv>\n          <div style=\"position: absolute; left: 0; right: 0; height: 1px; top: {{ linked.top }}; background: color-mix(in srgb, var(--color-accent) 40%, transparent)\"><\u002Fdiv>\n          <div style=\"position: absolute; top: 10px; left: {{ linked.left }}; transform: translateX(8px); padding: 3px 7px; border-radius: var(--radius-md); background: var(--color-bg); box-shadow: var(--shadow-sm); font-size: 11px; font-variant-numeric: tabular-nums; color: var(--color-accent-800)\">{{ linked.coord }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-for list=\"{{ trails }}\" as=\"t\" hint-placeholder-count=\"0\">\n        <div style=\"position: absolute; left: {{ t.left }}; top: {{ t.top }}; width: 5px; height: 5px; border-radius: 50%; transform: translate(-50%, -50%); background: var(--color-accent); opacity: {{ t.opacity }}\"><\u002Fdiv>\n      <\u002Fsc-for>\n\n      <sc-for list=\"{{ pins }}\" as=\"p\" hint-placeholder-count=\"14\">\n        <div style=\"position: absolute; left: {{ p.left }}; top: {{ p.top }}; transform: translate(-50%, -50%); z-index: {{ p.z }}; padding: 7px; cursor: pointer\" sc-camel-on-mouse-enter=\"{{ p.enter }}\" sc-camel-on-click=\"{{ p.click }}\">\n          <div style=\"display: flex; align-items: center; justify-content: center; width: {{ p.size }}; height: {{ p.size }}; border-radius: 5px; background: {{ p.fill }}; border: 1.5px solid {{ p.stroke }}; box-shadow: {{ p.glow }}; opacity: {{ p.opacity }}; transition: width 240ms cubic-bezier(.2,.6,.2,1), height 240ms cubic-bezier(.2,.6,.2,1), background 240ms cubic-bezier(.2,.6,.2,1), box-shadow 120ms linear\">\n            <span style=\"font-family: var(--font-heading); font-size: 11px; color: var(--color-bg)\">{{ p.stopLabel }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <sc-for list=\"{{ vehicles }}\" as=\"v\" hint-placeholder-count=\"0\">\n        <div style=\"position: absolute; left: {{ v.left }}; top: {{ v.top }}; transform: translate(-50%, -50%); transition: left 1200ms cubic-bezier(.2,.6,.2,1), top 1200ms cubic-bezier(.2,.6,.2,1); z-index: 40; display: flex; align-items: center; gap: var(--space-2)\">\n          <div style=\"width: 11px; height: 11px; border-radius: 50%; background: var(--color-accent); border: 2px solid var(--color-bg); box-shadow: var(--shadow-sm)\"><\u002Fdiv>\n          <div style=\"white-space: nowrap; padding: 2px 7px; border-radius: var(--radius-md); background: var(--color-bg); box-shadow: var(--shadow-sm); font-size: 11px; color: var(--color-accent-800)\">{{ v.label }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <div style=\"position: absolute; z-index: 80; border: 1px solid var(--color-divider); left: var(--space-6); bottom: var(--space-6); padding: var(--space-4) var(--space-6); background: var(--color-bg); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm)\">\n        <div style=\"font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent); margin-bottom: var(--space-3)\">Key<\u002Fdiv>\n        <div style=\"display: grid; gap: var(--space-3)\">\n          <div style=\"display: flex; align-items: center; gap: var(--space-3); font-size: 12px\">\n            <i style=\"width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid color-mix(in srgb, var(--color-text) 38%, transparent)\"><\u002Fi> Suspected — one vehicle\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: var(--space-3); font-size: 12px\">\n            <i style=\"width: 17px; height: 17px; border-radius: 5px; background: var(--color-accent)\"><\u002Fi> Confirmed — corroborated\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: var(--space-3); font-size: 12px\">\n            <i style=\"width: 17px; height: 17px; border-radius: 5px; background: var(--color-accent-800)\"><\u002Fi> Scheduled — on a route\n          <\u002Fdiv>\n          <div style=\"display: flex; align-items: center; gap: var(--space-3); font-size: 12px\">\n            <i style=\"width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--color-neutral-300)\"><\u002Fi> Repaired — closed today\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"margin-top: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--color-divider); font-size: 12px; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">Marker size shows severity<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"position: absolute; z-index: 80; right: var(--space-6); bottom: var(--space-6); display: flex; align-items: center; gap: var(--space-3); padding: var(--space-2) var(--space-3); border-radius: var(--radius-md); background: var(--color-bg); box-shadow: var(--shadow-sm); font-size: 11px; color: color-mix(in srgb, var(--color-text) 60%, transparent)\">\n        <span style=\"width: 60px; height: 2px; border-radius: 1px; background: color-mix(in srgb, var(--color-text) 45%, transparent)\"><\u002Fspan>\n        500 m\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <aside style=\"display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto auto; min-height: 0; background: var(--color-bg)\">\n\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--color-divider)\">\n        <sc-for list=\"{{ stats }}\" as=\"s\" hint-placeholder-count=\"3\">\n          <div style=\"padding: var(--space-4); border-right: 1px solid var(--color-divider)\">\n            <div style=\"font-family: var(--font-heading); font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums\">{{ s.value }}<\u002Fdiv>\n            <div style=\"margin-top: var(--space-2); font-size: 12px; line-height: 1.3; color: color-mix(in srgb, var(--color-text) 58%, transparent)\">{{ s.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; gap: var(--space-2); padding: var(--space-4); border-bottom: 1px solid var(--color-divider)\">\n        <sc-for list=\"{{ filters }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <button style=\"flex: 1; padding: 7px 0; font-family: var(--font-body); font-size: 12px; font-weight: 500; cursor: pointer; border-radius: var(--radius-lg); border: 1px solid {{ f.border }}; background: {{ f.bg }}; color: {{ f.color }}; transition: background 120ms linear\" sc-camel-on-click=\"{{ f.click }}\">{{ f.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"display: flex; align-items: center; justify-content: space-between; padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--color-divider); font-size: 12px; color: color-mix(in srgb, var(--color-text) 58%, transparent)\">\n        <span style=\"font-weight: 600; color: var(--color-text)\">Repair queue<\u002Fspan>\n        <span>{{ queueCount }} · sorted by priority<\u002Fspan>\n      <\u002Fdiv>\n\n      <div ref=\"{{ listRef }}\" style=\"overflow-y: auto; min-height: 0\">\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"9\">\n          <div style=\"display: flex; align-items: center; gap: var(--space-3); height: {{ rowHeight }}; padding: 0 var(--space-4); border-bottom: 1px solid color-mix(in srgb, var(--color-text) 7%, transparent); box-shadow: inset 3px 0 0 {{ r.mark }}; background: {{ r.bg }}; cursor: pointer; transition: background 120ms linear\" sc-camel-on-mouse-enter=\"{{ r.enter }}\" sc-camel-on-click=\"{{ r.click }}\">\n            <div style=\"flex: 1; min-width: 0\">\n              <div style=\"display: flex; align-items: baseline; gap: var(--space-2)\">\n                <span style=\"font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{ r.street }}<\u002Fspan>\n                <span style=\"font-size: 11px; color: color-mix(in srgb, var(--color-text) 45%, transparent); font-variant-numeric: tabular-nums\">{{ r.ref }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"margin-top: 2px; font-size: 12px; color: color-mix(in srgb, var(--color-text) 58%, transparent); font-variant-numeric: tabular-nums\">{{ r.evidence }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display: flex; gap: 2px; align-items: center\">\n              <sc-for list=\"{{ r.segs }}\" as=\"g\" hint-placeholder-count=\"4\">\n                <i style=\"display: block; width: 9px; height: 5px; border-radius: 2px; background: {{ g.fill }}\"><\u002Fi>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"width: 42px; text-align: right; font-family: var(--font-heading); font-size: 18px; font-variant-numeric: tabular-nums; color: {{ r.priColor }}\">{{ r.priority }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"min-height: 132px; padding: var(--space-3) var(--space-4); border-top: 1px solid var(--color-divider); background: color-mix(in srgb, var(--color-text) 3%, transparent)\">\n        <div style=\"font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 55%, transparent)\">Evidence<\u002Fdiv>\n        <sc-if value=\"{{ inspector }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"margin-top: var(--space-2)\">\n            <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3)\">\n              <span style=\"font-family: var(--font-heading); font-size: 20px; line-height: 1.15\">{{ inspector.street }}<\u002Fspan>\n              <span class=\"tag tag-outline\" style=\"border-radius: var(--radius-lg); font-size: 11px\">{{ inspector.status }}<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"margin-top: var(--space-1); font-size: 13px; line-height: 1.4; color: color-mix(in srgb, var(--color-text) 72%, transparent); font-variant-numeric: tabular-nums\">{{ inspector.line1 }}<\u002Fdiv>\n            <div style=\"font-size: 13px; line-height: 1.4; color: color-mix(in srgb, var(--color-text) 72%, transparent); font-variant-numeric: tabular-nums\">{{ inspector.line2 }}<\u002Fdiv>\n            <div style=\"margin-top: var(--space-1); font-size: 12px; line-height: 1.35; color: color-mix(in srgb, var(--color-text) 50%, transparent)\">{{ inspector.hint }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ noInspector }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"margin-top: var(--space-3); font-size: 13px; line-height: 1.5; color: color-mix(in srgb, var(--color-text) 50%, transparent); max-width: 34ch\">Point at a queue row or a marker to link the two. Arrow keys move the link, Enter adds it to tomorrow's route.<\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"height: 68px; display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); padding: 0 var(--space-4); border-top: 1px solid var(--color-divider)\">\n        <div style=\"font-size: 12px; line-height: 1.4; color: color-mix(in srgb, var(--color-text) 62%, transparent); font-variant-numeric: tabular-nums\">\n          <div style=\"font-size: 13px; font-weight: 600; color: var(--color-text)\">{{ selLabel }}<\u002Fdiv>\n          <div>{{ selDetail }}<\u002Fdiv>\n        <\u002Fdiv>\n        <button class=\"btn btn-primary\" style=\"border-radius: var(--radius-lg); font-family: var(--font-body); font-size: 13px; font-weight: 600; padding: 11px 18px; white-space: nowrap; cursor: pointer\" disabled=\"{{ planDisabled }}\" sc-camel-on-click=\"{{ clearSel }}\">Plan route<\u002Fbutton>\n      <\u002Fdiv>\n\n    <\u002Faside>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;authority&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dundee City Council&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;density&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Comfortable&quot;,&quot;Compact&quot;],&quot;default&quot;:&quot;Comfortable&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;liveFeed&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.listRef = React.createRef();\n    this.roads = [\n      { name: 'Ferry Road', d: 'M0,14 C20,17 40,10 60,15 S90,21 100,18' },\n      { name: 'Wellgate', d: 'M0,52 C25,48 45,58 70,50 S92,44 100,46' },\n      { name: 'Northgate', d: 'M30,0 C32,20 27,40 34,60 S30,86 32,100' },\n      { name: 'Dock Approach', d: 'M86,0 C84,25 90,45 84,66 S88,88 86,100' },\n      { name: 'Kirk Street', d: 'M34,100 C50,78 62,60 78,44 S95,31 100,26' },\n      { name: 'Albion Terrace', d: 'M0,32 C22,29 38,36 62,31 S88,26 100,29' },\n      { name: 'Carlton Way', d: 'M0,66 C20,63 36,70 58,65 S86,61 100,64' },\n      { name: 'Market Row', d: 'M12,4 C14,26 9,48 14,68 S11,90 13,100' },\n      { name: 'St Andrews Road', d: 'M56,10 C58,30 52,50 57,70 S54,90 56,100' },\n      { name: 'Bridge Lane', d: 'M0,90 C24,86 48,94 72,89 S94,86 100,88' }\n    ];\n    this.samplers = this.roads.map(r => this.makeSampler(r.d));\n    this.state = { items: this.build(), hover: null, hoverSrc: null, sel: [], filter: 'open', tick: 0, veh: this.buildVehicles() };\n  }\n\n  makeSampler(d) {\n    try {\n      const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');\n      svg.setAttribute('style', 'position:absolute;width:0;height:0;overflow:hidden');\n      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');\n      path.setAttribute('d', d);\n      svg.appendChild(path);\n      document.body.appendChild(svg);\n      const len = path.getTotalLength();\n      const pts = [];\n      for (let i = 0; i <= 200; i++) {\n        const p = path.getPointAtLength((i / 200) * len);\n        pts.push([p.x, p.y]);\n      }\n      document.body.removeChild(svg);\n      return pts;\n    } catch (e) {\n      return [[0, 0], [100, 100]];\n    }\n  }\n\n  at(segIndex, t) {\n    const pts = this.samplers[segIndex];\n    const i = Math.min(pts.length - 1, Math.max(0, Math.round(t * (pts.length - 1))));\n    return pts[i];\n  }\n\n  rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6d2b79f5) >>> 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }\n\n  build() {\n    const r = this.rng(20260902);\n    const out = [];\n    for (let i = 0; i < 26; i++) {\n      const si = Math.floor(r() * this.roads.length);\n      const t = 0.06 + r() * 0.88;\n      const pt = this.at(si, t);\n      const x = pt[0] + (r() - 0.5) * 1.1;\n      const y = pt[1] + (r() - 0.5) * 1.1;\n      const severity = Math.round((0.18 + r() * 0.8) * 100) / 100;\n      const vehicles = 1 + Math.floor(r() * r() * 6);\n      const passes = vehicles * (2 + Math.floor(r() * 9));\n      const age = Math.round(r() * 13 * 10) / 10;\n      let status = vehicles >= 2 ? 'confirmed' : 'suspected';\n      const roll = r();\n      if (status === 'confirmed' && roll > 0.82) status = 'scheduled';\n      else if (status === 'confirmed' && roll < 0.08) status = 'repaired';\n      out.push({\n        id: 'p' + i,\n        ref: 'BCH-' + String(1040 + i * 7),\n        street: this.roads[si].name,\n        x, y, severity, vehicles, passes, age, status,\n        stop: status === 'scheduled' ? 1 + Math.floor(r() * 8) : null,\n        lastPass: (6 + Math.floor(r() * 11)) + ':' + String(Math.floor(r() * 60)).padStart(2, '0'),\n        priority: severity * Math.log(1 + vehicles) * (1 + age)\n      });\n    }\n    out.sort((a, b) => b.priority - a.priority);\n    return out;\n  }\n\n  buildVehicles() {\n    return [\n      { label: 'Bus 22', seg: 0, t: 0.1, dir: 1 },\n      { label: 'Bus 9', seg: 2, t: 0.62, dir: -1 },\n      { label: 'Refuse 4', seg: 6, t: 0.35, dir: 1 }\n    ];\n  }\n\n  componentDidMount() {\n    this.onKey = (e) => {\n      const rows = this.filtered();\n      if (!rows.length) return;\n      const i = rows.findIndex(p => p.id === this.state.hover);\n      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {\n        e.preventDefault();\n        const n = e.key === 'ArrowDown' ? Math.min(rows.length - 1, i + 1) : Math.max(0, i < 0 ? 0 : i - 1);\n        this.link(rows[n].id, 'map');\n      } else if (e.key === 'Enter' && i >= 0) {\n        e.preventDefault(); this.toggle(rows[i].id);\n      } else if (e.key === 'Escape') {\n        this.setState({ sel: [], hover: null });\n      }\n    };\n    window.addEventListener('keydown', this.onKey);\n    this.timer = setInterval(() => {\n      if (this.props.liveFeed === false) return;\n      this.setState(s => ({\n        tick: s.tick + 1,\n        veh: s.veh.map(v => {\n          let t = v.t + v.dir * 0.03;\n          let dir = v.dir;\n          if (t > 1) { t = 1; dir = -1; } else if (t < 0) { t = 0; dir = 1; }\n          return Object.assign({}, v, { t, dir });\n        })\n      }));\n    }, 1200);\n  }\n\n  componentWillUnmount() { clearInterval(this.timer); window.removeEventListener('keydown', this.onKey); }\n\n  componentDidUpdate(_, prev) {\n    if (prev.hover !== this.state.hover && this.state.hoverSrc === 'map' && this.listRef.current) {\n      const rows = this.filtered();\n      const i = rows.findIndex(p => p.id === this.state.hover);\n      if (i < 0) return;\n      const el = this.listRef.current;\n      const h = this.rowH();\n      const top = i * h;\n      if (top < el.scrollTop || top + h > el.scrollTop + el.clientHeight) {\n        el.scrollTop = Math.max(0, top - el.clientHeight / 2 + h / 2);\n      }\n    }\n  }\n\n  rowH() { return this.props.density === 'Compact' ? 46 : 58; }\n\n  filtered() {\n    const f = this.state.filter;\n    return this.state.items.filter(p => {\n      if (f === 'all') return true;\n      if (f === 'open') return p.status === 'suspected' || p.status === 'confirmed';\n      return p.status === f;\n    });\n  }\n\n  link(id, src) { this.setState({ hover: id, hoverSrc: src }); }\n\n  toggle(id) {\n    this.setState(s => ({ sel: s.sel.indexOf(id) >= 0 ? s.sel.filter(x => x !== id) : s.sel.concat([id]) }));\n  }\n\n  renderVals() {\n    const st = this.state;\n    const rowsData = this.filtered();\n    const isSel = id => st.sel.indexOf(id) >= 0;\n    const statusLabel = { suspected: 'Suspected', confirmed: 'Confirmed', scheduled: 'Scheduled', repaired: 'Repaired' };\n\n    const pins = st.items.map(p => {\n      const linked = st.hover === p.id;\n      const sel = isSel(p.id);\n      let fill = 'var(--color-bg)', stroke = 'color-mix(in srgb, var(--color-text) 38%, transparent)', opacity = 1;\n      if (p.status === 'confirmed') { fill = 'var(--color-accent)'; stroke = 'var(--color-accent)'; }\n      if (p.status === 'scheduled') { fill = 'var(--color-accent-800)'; stroke = 'var(--color-accent-800)'; }\n      if (p.status === 'repaired') { stroke = 'var(--color-neutral-300)'; opacity = 0.55; }\n      const size = Math.round(12 + p.severity * 11 + (linked || sel ? 5 : 0));\n      let glow = 'var(--shadow-sm)';\n      if (sel) glow = '0 0 0 4px var(--color-accent-200)';\n      if (linked) glow = '0 0 0 5px color-mix(in srgb, var(--color-accent) 24%, transparent)';\n      return {\n        left: p.x.toFixed(2) + '%', top: p.y.toFixed(2) + '%',\n        size: size + 'px', fill, stroke, glow, opacity,\n        z: linked ? 60 : sel ? 50 : 20,\n        stopLabel: p.status === 'scheduled' ? String(p.stop) : '',\n        enter: () => this.link(p.id, 'row'),\n        click: () => this.toggle(p.id)\n      };\n    });\n\n    const rows = rowsData.map(p => {\n      const linked = st.hover === p.id;\n      const sel = isSel(p.id);\n      let mark = 'var(--color-neutral-400)';\n      if (p.status === 'confirmed') mark = 'var(--color-accent)';\n      if (p.status === 'scheduled') mark = 'var(--color-accent-800)';\n      if (p.status === 'repaired') mark = 'var(--color-neutral-300)';\n      const filledSegs = Math.max(1, Math.ceil(p.severity * 4));\n      return {\n        street: p.street,\n        ref: p.ref,\n        evidence: p.vehicles + (p.vehicles === 1 ? ' vehicle · ' : ' vehicles · ') + p.passes + ' passes · ' + statusLabel[p.status].toLowerCase(),\n        priority: p.priority.toFixed(1),\n        priColor: sel || linked ? 'var(--color-accent-800)' : 'color-mix(in srgb, var(--color-text) 70%, transparent)',\n        mark,\n        bg: sel ? 'var(--color-accent-100)' : linked ? 'color-mix(in srgb, var(--color-text) 5%, transparent)' : 'transparent',\n        segs: [0, 1, 2, 3].map(i => ({ fill: i < filledSegs ? mark : 'color-mix(in srgb, var(--color-text) 12%, transparent)' })),\n        enter: () => this.link(p.id, 'row'),\n        click: () => this.toggle(p.id)\n      };\n    });\n\n    const hovered = st.items.find(p => p.id === st.hover) || null;\n    const linkedItem = hovered ? {\n      left: hovered.x.toFixed(2) + '%', top: hovered.y.toFixed(2) + '%',\n      coord: (56.47 - hovered.y / 100 * 0.03).toFixed(4) + ', ' + (-2.97 + hovered.x / 100 * 0.06).toFixed(4)\n    } : false;\n\n    const inspector = hovered ? {\n      street: hovered.street + ' ' + hovered.ref,\n      status: statusLabel[hovered.status],\n      line1: hovered.vehicles + ' distinct vehicles · ' + hovered.passes + ' passes · last ' + hovered.lastPass,\n      line2: 'Severity ' + hovered.severity.toFixed(2) + ' · age ' + hovered.age.toFixed(1) + ' months · priority ' + hovered.priority.toFixed(1),\n      hint: isSel(hovered.id) ? 'In tomorrow\\u2019s route. Click to remove.' : hovered.status === 'suspected' ? 'One vehicle only. A second pass by another vehicle confirms it.' : 'Click to add to tomorrow\\u2019s route.'\n    } : false;\n\n    const veh = st.veh.map(v => {\n      const pt = this.at(v.seg, v.t);\n      return { label: v.label, left: pt[0].toFixed(2) + '%', top: pt[1].toFixed(2) + '%' };\n    });\n\n    const trails = [];\n    st.veh.forEach(v => {\n      for (let k = 1; k <= 5; k++) {\n        const t = Math.min(1, Math.max(0, v.t - v.dir * 0.03 * k));\n        const pt = this.at(v.seg, t);\n        trails.push({ left: pt[0].toFixed(2) + '%', top: pt[1].toFixed(2) + '%', opacity: (0.28 - k * 0.045).toFixed(2) });\n      }\n    });\n\n    const counts = { suspected: 0, confirmed: 0, scheduled: 0, repaired: 0 };\n    st.items.forEach(p => counts[p.status]++);\n\n    const filters = [\n      { key: 'open', label: 'Open' },\n      { key: 'suspected', label: 'Suspected' },\n      { key: 'confirmed', label: 'Confirmed' },\n      { key: 'scheduled', label: 'Scheduled' }\n    ].map(f => ({\n      label: f.label,\n      click: () => this.setState({ filter: f.key }),\n      bg: st.filter === f.key ? 'var(--color-accent)' : 'transparent',\n      color: st.filter === f.key ? 'var(--color-bg)' : 'color-mix(in srgb, var(--color-text) 70%, transparent)',\n      border: st.filter === f.key ? 'var(--color-accent)' : 'var(--color-divider)'\n    }));\n\n    const selItems = st.items.filter(p => isSel(p.id));\n    const mins = selItems.length * 20 + Math.round(selItems.length * 6.5);\n\n    return {\n      authority: this.props.authority ?? 'Dundee City Council',\n      liveLabel: this.props.liveFeed === false ? 'Feed paused' : '3 vehicles reporting',\n      kmLabel: (148.6 + st.tick * 0.11).toFixed(1),\n      dateLabel: 'Wed 2 September 2026',\n      pins, rows, vehicles: veh, trails, filters,\n      listRef: this.listRef,\n      rowHeight: this.rowH() + 'px',\n      queueCount: rowsData.length + ' of ' + st.items.length,\n      linked: linkedItem,\n      inspector,\n      noInspector: !hovered,\n      stats: [\n        { value: String(counts.confirmed), label: 'Confirmed and open' },\n        { value: String(counts.suspected), label: 'Awaiting a second pass' },\n        { value: String(counts.scheduled), label: 'Scheduled today' }\n      ],\n      selLabel: selItems.length ? selItems.length + ' selected for tomorrow' : 'Nothing selected',\n      selDetail: selItems.length ? '~' + mins + ' min including travel · crew Ferry Depot A' : 'Click a row or a marker to build a route',\n      planDisabled: selItems.length === 0,\n      clearHover: () => this.setState({ hover: null }),\n      clearSel: () => this.setState({ sel: [] })\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
